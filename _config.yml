# Site settings
title: CancerEvo
description: Mathematical modeling of cancer ecology, evolution, and treatment resistance at Moffitt Cancer Center.
url: "https://cancerevo.org"
baseurl: ""
logo: /assets/images/favicon.svg

# Author information
moffitt_url: https://www.moffitt.org/
imo_url: https://www.moffitt.org/research-science/divisions-and-departments/quantitative-science/integrated-mathematical-oncology/
author:
  name: David Basanta Gutierrez
  email: david@cancerevo.org
  position: Senior Member/Professor
  institution: Moffitt Cancer Center
  department: Integrated Mathematical Oncology

# Build settings
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/og-cancerevo.jpg
        width: 1200
        height: 630
        alt: CancerEvo — mathematical models for evolution-informed cancer treatment
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md

# Collections for team members
collections:
  team:
    output: false

# Navigation
navigation:   # same sections, same order, as the homepage tiles; the logo links home
  - title: Research
    url: /research
  - title: Publications
    url: /publications
  - title: Team
    url: /team
  - title: Models & Code
    url: /models
  - title: Outreach
    url: /outreach
  - title: About
    url: /about
