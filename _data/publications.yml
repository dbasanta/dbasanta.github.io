  title: The adaptive state determines the impact of mutations on evolving populations
  authors: Tyczynska Weh M, Kumar P, Marusyk V, Marusyk A, Basanta D
  group_authors:
  - Tyczynska Weh M
  - Basanta D
  venue: Proceedings of the National Academy of Sciences
  details: 122(26):e2427070122
  kind: article
  doi: 10.1073/pnas.2427070122
  preprints:
  - server: bioRxiv
    url: https://doi.org/10.1101/2024.12.11.627972
  theme: selection
  summary: 'In a spatial agent-based model of a tumor population evolving resistance to targeted therapy, favorable mutations were over-represented at the extinction bottleneck but depleted at the adaptive peak. Experiments confirmed the prediction: raising the mutation rate helped cancer cells under therapy but was moderately harmful at baseline, suggesting that restricting mutational variability could be therapeutic.'
