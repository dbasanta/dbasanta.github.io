  summary: Fluctuating resources can let two phenotypes coexist on one resource. Models of 'cream skimmers', which do better in rich times, and 'crumb pickers', which do better in poor times, together with the argument that nutrients, oxygen and pH fluctuate in tumors, suggest this coexistence mechanism is likely in cancer; candidate biomarkers for the two phenotypes are proposed and explored.
