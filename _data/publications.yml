  summary: An agent-based model of the leukemic bone marrow, parameterized with in vitro and in vivo data, captures how endothelial miR-126 lets leukemic stem cells return to quiescence and escape tyrosine kinase inhibitors. Simulations show that adding the miR-126 inhibitor miRisten on a defined schedule dismantles this protective vascular niche.
