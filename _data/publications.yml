  summary: A hybrid agent-based model of multiple myeloma in bone shows that resistance arises from myeloma-intrinsic mechanisms, but that environment-mediated drug resistance in the bone makes resistant clones more likely and more heterogeneous. The model predicts, and in vivo studies support, that targeting this protection deepens responses by eliminating sensitive cells sheltered near stroma and bone.
