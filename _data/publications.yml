    url: https://doi.org/10.1101/2023.02.07.527543
  theme: stroma
  summary: 'In triple-negative breast cancer, stroma did not directly reduce chemosensitivity in vitro, but stromal factors increased tumor-cell proliferation, and proximity to stroma was associated with faster proliferation in vivo. A spatial agent-based model parameterized from histology showed that this lets residual tumors recover between chemotherapy cycles: an indirect form of stroma-mediated chemoresistance.'
