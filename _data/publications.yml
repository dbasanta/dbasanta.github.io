  summary: Combines spatial measurements of proliferation and death in an animal model of targeted therapy with spatial mathematical models to dissect how the amount, reach and layout of stroma affect tumor cells' ability to escape elimination. The spatial distribution of stroma within the tumor had a particularly strong effect.
