  title: Multifactorial sheltering in peristromal niches shapes in vivo responses of lung cancers to targeted therapies
  authors: Desai B, Miti T, Prabhakaran S, Miroshnychenko D, Kumar P, Henry M, …, Basanta D, Marusyk A
  group_authors:
  - Miti T
  - Basanta D
  venue: Nature Communications
  details: 17(1):7003
  kind: article
  doi: 10.1038/s41467-026-73454-w
  preprints:
  - server: bioRxiv
    url: https://doi.org/10.1101/2024.04.24.590626
  - server: Research Square
    url: https://doi.org/10.21203/rs.3.rs-6264377/v1
  theme: stroma
  summary: In models of ALK-positive lung cancer, tumor cells next to stroma survive targeted therapy through many juxtacrine and paracrine signals acting together, an ecological rescue that sustains residual disease. Rather than blocking those signals one at a time, the residual cells' adaptive HER2 upregulation can be exploited with the antibody-drug conjugate T-DXd, which strongly improved responses and suppressed relapse.
