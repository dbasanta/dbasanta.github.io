<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <nav>
        <div class="container">
            <a href="{{ '/' | relative_url }}" class="logo">{{ site.title }}</a>
            <ul>
                {% for item in site.navigation %}
                <li><a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active"{% endif %}>{{ item.title }}</a></li>
                {% endfor %}
            </ul>
        </div>
    </nav>

    <main class="container">
        {{ content }}
    </main>

    <div class="moffitt-banner">
        <div class="container">
            <a href="https://moffitt.org" target="_blank" rel="noopener">
                <img src="{{ '/assets/images/moffitt-logo.svg' | relative_url }}" alt="Moffitt Cancer Center" class="moffitt-logo">
            </a>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author.name }}. All rights reserved.</p>
            <div class="social-links">
                <a href="https://twitter.com/dbasanta" target="_blank" rel="noopener">Twitter</a>
                <a href="https://www.linkedin.com/in/david-basanta" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://github.com/dbasanta" target="_blank" rel="noopener">GitHub</a>
                <a href="https://scholar.google.com" target="_blank" rel="noopener">Google Scholar</a>
                <a href="https://www.youtube.com/@dbasanta" target="_blank" rel="noopener">YouTube</a>
            </div>
        </div>
    </footer>
</body>
</html>
